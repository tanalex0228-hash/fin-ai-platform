{% extends "base.html" %}
{% block content %}

<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>

<h2>K 線主圖（含 MA 與成交量）</h2>

<div>
    <input id="symbol" placeholder="輸入 2330.TW">
    <button onclick="loadChart()">載入</button>
</div>

<div id="chart" style="width:100%;height:600px;margin-top:20px;"></div>

<script>
// ✅ 第 3 步：頁面載入時，讀取上一次的 symbol，然後自動畫圖
window.onload = function () {
    const last = localStorage.getItem("last_symbol");
    if (last) {
        document.getElementById("symbol").value = last;
        loadChart();   // ← 自動幫你畫一次，不用按按鈕
    }
};

async function loadChart() {
    const symbol = document.getElementById("symbol").value.trim();
    localStorage.setItem("last_symbol", symbol);


    const res = await fetch(`/api/get_prices?symbol=${symbol}`);
    const data = await res.json();
    const prices = data.prices;

    const dates  = prices.map(p => p.date);
    const open   = prices.map(p => p.open);
    const high   = prices.map(p => p.high);
    const low    = prices.map(p => p.low);
    const close  = prices.map(p => p.close);
    const volume = prices.map(p => p.volume);

    // MA 計算
    function MA(arr, n) {
        return arr.map((v, i) =>
            i < n ? null :
            arr.slice(i - n, i).reduce((a, b) => a + b) / n
        );
    }
    const ma5 = MA(close, 5);
    const ma20 = MA(close, 20);
    const ma60 = MA(close, 60);

    // K 線
    const candle = {
        x: dates, open, high, low, close,
        type: "candlestick",
        name: `${symbol} K 線`,
    };

    const ma5Line = { x: dates, y: ma5, mode:"lines", name:"MA5", line:{color:"orange"} };
    const ma20Line = { x: dates, y: ma20, mode:"lines", name:"MA20", line:{color:"blue"} };
    const ma60Line = { x: dates, y: ma60, mode:"lines", name:"MA60", line:{color:"purple"} };

    const volumeBar = {
        x: dates, y: volume,
        type:"bar",
        name:"成交量",
        marker:{color:"rgba(100,100,100,0.4)"},
        yaxis:"y2"
    };

    Plotly.newPlot("chart", [candle, ma5Line, ma20Line, ma60Line, volumeBar], {
        title: `${symbol} 技術分析（K 線主圖）`,
        xaxis: { rangeslider: { visible: false }},
        yaxis: { domain:[0.3, 1] },
        yaxis2: { domain:[0, 0.25], side:"right" }
    });
}
</script>

{% endblock %}
