{% extends "base.html" %}
{% block content %}

<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>

<h2>成交量 Volume</h2>

<div>
    <input id="symbol" placeholder="輸入 2330.TW">
    <button onclick="loadVolume()">載入</button>
</div>

<div id="chart" style="width:100%;height:500px;margin-top:20px;"></div>

<script>
window.onload = function () {
    const last = localStorage.getItem("last_symbol");
    if (last) {
        document.getElementById("symbol").value = last;
        loadVolume();
    }
};


async function loadVolume() {

    const symbol = document.getElementById("symbol").value.trim();
    localStorage.setItem("last_symbol", symbol);

    const data = await (await fetch(`/api/get_prices?symbol=${symbol}`)).json();
    const p = data.prices;

    const dates = p.map(x => x.date);
    const volume = p.map(x => x.volume);

    const trace = {
        x: dates,
        y: volume,
        type: "bar",
        name: "成交量",
        marker:{color:"rgba(100,100,255,0.5)"}
    };

    Plotly.newPlot("chart", [trace], {
        title: `${symbol} 成交量`,
        xaxis:{},
        yaxis:{}
    });
}
</script>

{% endblock %}
