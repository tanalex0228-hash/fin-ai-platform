{% extends "base.html" %}
{% block content %}

<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>

<h2>KD 指標（Stochastic）</h2>

<div>
    <input id="symbol" placeholder="輸入 2330.TW">
    <button onclick="loadKD()">載入</button>
</div>

<div id="chart" style="width:100%;height:600px;margin-top:20px;"></div>

<script>
window.onload = function () {
    const last = localStorage.getItem("last_symbol");
    if (last) {
        document.getElementById("symbol").value = last;
        loadKD();
    }
};

async function loadKD() {

    const symbol = document.getElementById("symbol").value.trim();
    localStorage.setItem("last_symbol", symbol);

    const data = await (await fetch(`/api/get_prices?symbol=${symbol}`)).json();
    const p = data.prices;

    const dates = p.map(x => x.date);
    const high = p.map(x => x.high);
    const low  = p.map(x => x.low);
    const close = p.map(x => x.close);

    let K = 50, D = 50;
    const Kline = [], Dline = [];

    for (let i = 0; i < close.length; i++) {
        if (i < 9) { Kline.push(null); Dline.push(null); continue; }

        const hh = Math.max(...high.slice(i-9, i));
        const ll = Math.min(...low.slice(i-9, i));
        const RSV = (close[i] - ll) / (hh - ll + 1e-9) * 100;

        K = (2/3)*K + (1/3)*RSV;
        D = (2/3)*D + (1/3)*K;

        Kline.push(K);
        Dline.push(D);
    }

    const kTrace = { x: dates, y: Kline, mode:"lines", name:"K", line:{color:"orange"} };
    const dTrace = { x: dates, y: Dline, mode:"lines", name:"D", line:{color:"blue"} };

    Plotly.newPlot("chart", [kTrace, dTrace], {
        title: `${symbol} KD 指標`,
        xaxis:{},
        yaxis:{}
    });
}
</script>

{% endblock %}
