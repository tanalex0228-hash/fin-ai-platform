{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
  <h2>📉 Monte Carlo Drawdown</h2>
  <p class="text-muted">模擬 GBM 路徑後，計算每條路徑最大回撤（Max Drawdown）。</p>

  <div class="card p-3 mb-3">
    <div class="row g-2 align-items-end">
      <div class="col-md-3">
        <label class="form-label">Symbol</label>
        <input id="mc-symbol" class="form-control" value="{{ symbol or '2330.TW' }}" />
      </div>
      <div class="col-md-3">
        <label class="form-label">回測次數 (n_simulations)</label>
        <input id="mc-n" class="form-control" type="number" min="100" max="200000" value="2000" />
      </div>
      <div class="col-md-3">
        <label class="form-label">預測天數 (horizon)</label>
        <input id="mc-horizon" class="form-control" type="number" min="10" max="2000" value="252" />
      </div>
      <div class="col-md-2">
        <label class="form-label">Seed (可空)</label>
        <input id="mc-seed" class="form-control" placeholder="e.g. 42" />
      </div>
      <div class="col-md-1 d-grid">
        <button id="mc-run" class="btn btn-primary">Run</button>
      </div>
    </div>

    <div class="mt-3">
      <small id="mc-status" class="text-muted"></small>
    </div>
  </div>

  <div id="mc-error" class="alert alert-danger d-none"></div>

  <div class="row">
    <div class="col-lg-4">
      <div class="card p-3 mb-3">
        <h5 class="mb-3">結果摘要</h5>
        <div id="mc-summary" class="small text-muted">尚未執行</div>
      </div>
    </div>

    <div class="col-lg-8">
      <div class="card p-3 mb-3">
        <h5 class="mb-2">Drawdown 曲線（最差 / 中位 / 最好）</h5>
        <div id="dd-chart" style="height: 360px;"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>

<script>
function fmtPct(x) {
  if (x === null || x === undefined || Number.isNaN(x)) return "—";
  return `${x.toFixed(2)}%`;
}

function showError(msg) {
  const box = document.getElementById("mc-error");
  box.classList.remove("d-none");
  box.innerText = msg;
}

function clearError() {
  const box = document.getElementById("mc-error");
  box.classList.add("d-none");
  box.innerText = "";
}

async function runMonteCarlo() {
  clearError();

  const symbol = document.getElementById("mc-symbol").value.trim();
  if (typeof setActiveSymbol === "function") setActiveSymbol(symbol);

  const n = document.getElementById("mc-n").value;
  const horizon = document.getElementById("mc-horizon").value;
  const seed = document.getElementById("mc-seed").value.trim();

  const status = document.getElementById("mc-status");
  const btn = document.getElementById("mc-run");

  btn.disabled = true;
  status.innerText = "Running…";

  try {
    const url = new URL("/api/monte_carlo", window.location.origin);
    url.searchParams.set("symbol", symbol);
    url.searchParams.set("n_simulations", n);
    url.searchParams.set("horizon", horizon);
    if (seed !== "") url.searchParams.set("seed", seed);

    const res = await fetch(url.toString());
    const data = await res.json();

    if (!res.ok || data.status !== "success") {
      throw new Error(data.message || "API error");
    }

    const s = data.summary.max_drawdown_pct;
    document.getElementById("mc-summary").innerHTML = `
      <div><b>Symbol:</b> ${data.symbol}</div>
      <div><b>History len:</b> ${data.history_len}</div>
      <div><b>Last close:</b> ${data.last_close.toFixed(4)}</div>
      <hr/>
      <div><b>Max Drawdown (worst):</b> ${fmtPct(s.worst)}</div>
      <div><b>Mean:</b> ${fmtPct(s.mean)}</div>
      <div><b>P50 (median):</b> ${fmtPct(s.p50)}</div>
      <div><b>P10 / P90:</b> ${fmtPct(s.p10)} / ${fmtPct(s.p90)}</div>
      <div><b>P05 / P95:</b> ${fmtPct(s.p05)} / ${fmtPct(s.p95)}</div>
      <div><b>Best:</b> ${fmtPct(s.best)}</div>
    `;

    const dd = data.drawdown_series;
    const x = Array.from({length: dd.worst.length}, (_, i) => i);

    Plotly.newPlot("dd-chart", [
      { x, y: dd.worst,  name: "Worst",  mode: "lines" },
      { x, y: dd.median, name: "Median", mode: "lines" },
      { x, y: dd.best,   name: "Best",   mode: "lines" },
    ], {
      xaxis: { title: "Day" },
      yaxis: { title: "Drawdown (<= 0)", tickformat: ".0%" },
      margin: { l: 50, r: 20, t: 20, b: 50 },
      legend: { orientation: "h" },
    }, {displayModeBar: false});

    status.innerText = "Done ✅";
  } catch (err) {
    showError(err.message || String(err));
    status.innerText = "Failed ❌";
  } finally {
    btn.disabled = false;
  }
}

document.getElementById("mc-run").addEventListener("click", runMonteCarlo);

// ✅ 進頁自動把 symbol 填成：?symbol=... → active_symbol → input 原本值
(function initMonteCarloSymbol() {
  const input = document.getElementById("mc-symbol");
  if (!input) return;

  let sym = "";
  try {
    const sp = new URLSearchParams(window.location.search);
    sym = (sp.get("symbol") || "").trim();
  } catch (e) {}

  if (!sym && typeof getActiveSymbol === "function") {
    sym = (getActiveSymbol() || "").trim();
  }

  if (sym) input.value = sym.toUpperCase();
})();

</script>

{% endblock %}
